<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ethan Mebaley Kahel – Projets</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..800&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f8;--ink:#0b1230;--mute:#4b5878;--panel:#ffffff;--line:#cfd7e8;--k:#0b1230;
--hd:"Bricolage Grotesque","Trebuchet MS",Arial,sans-serif;--bd:"Instrument Sans","Segoe UI",Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f1f;--ink:#f1f4ff;--mute:#a3afcb;--panel:#141b33;--line:#27315a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0f1f;--ink:#f1f4ff;--mute:#a3afcb;--panel:#141b33;--line:#27315a;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 var(--bd);min-height:100vh;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}
.wrap{max-width:70rem;margin:0 auto;padding:0 1.25rem}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1.2rem 0}
.mark{display:grid;place-items:center;width:2.8rem;height:2.8rem;border-radius:14px;background:var(--ink);color:var(--bg);font:800 1rem var(--hd);text-decoration:none;letter-spacing:-.04em}
.tools{display:flex;gap:.6rem;align-items:center}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.2rem}
.tools button{font:700 .9rem var(--bd);color:var(--ink);background:transparent;border:0;border-radius:999px;padding:.4rem .85rem;cursor:pointer;min-height:2.3rem}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#theme{background:var(--panel);border:1px solid var(--line);width:2.9rem;padding:0;font-size:1.15rem}
.hero{padding:clamp(2rem,7vw,5rem) 0 2.2rem}
.hero h1{font:800 clamp(3rem,11.5vw,9rem)/.9 var(--hd);font-stretch:75%;letter-spacing:-.045em;margin:0;overflow-wrap:anywhere}
.hero p{max-width:36rem;color:var(--mute);font-size:1.25rem;margin:1.4rem 0 1.6rem}
.hero p b{color:var(--ink)}
.btn{display:inline-block;font-weight:700;text-decoration:none;border-radius:999px;padding:.75rem 1.4rem;border:2px solid var(--ink);color:var(--ink);transition:transform .2s}
.btn.main,.hero .btn{background:var(--ink);color:var(--bg)}
.btn:hover{transform:translateY(-2px)}
.list{display:grid;grid-template-columns:repeat(6,1fr);gap:1rem;padding-bottom:3rem}
.w2{grid-column:span 2}.w4{grid-column:span 4}
.tile{--c:#fff;position:relative;display:grid;grid-template-rows:auto 1fr auto;gap:.8rem;padding:1.5rem;min-height:23rem;border-radius:30px;background:var(--c);color:var(--k);text-decoration:none;overflow:hidden;
 transition:transform .3s cubic-bezier(.2,.8,.2,1),border-radius .3s;animation:up .7s both cubic-bezier(.2,.8,.2,1);animation-delay:calc(var(--i)*70ms)}
.tile:hover{transform:translateY(-6px) rotate(-.5deg);border-radius:40px}
.tile h2{font:800 clamp(1.55rem,2.4vw,2.1rem)/1 var(--hd);letter-spacing:-.035em;margin:0}
.tile p{margin:.55rem 0 0;font-weight:500;max-width:26rem}
.art{display:flex;align-items:center;justify-content:center;min-height:0}
.art svg{width:100%;height:100%;max-height:13rem;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.tile:hover .art svg{transform:scale(1.07) rotate(2deg)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:0;padding:0 3.6rem 0 0;list-style:none}
.chips li{font-size:.82rem;font-weight:700;background:rgba(255,255,255,.55);border:1.5px solid rgba(11,18,48,.25);border-radius:999px;padding:.12rem .65rem}
.go{position:absolute;right:1.2rem;bottom:1.2rem;display:grid;place-items:center;width:3rem;height:3rem;border-radius:50%;background:var(--k);color:#fff;font-size:1.3rem;transition:transform .3s}
.tile:hover .go{transform:rotate(-45deg) scale(1.1)}
@media (min-width:901px){.tile.w4{grid-template-columns:1.1fr 1fr;grid-template-rows:1fr auto}.w4 .tt{grid-column:1;grid-row:1}.w4 .chips{grid-column:1;grid-row:2}.w4 .art{grid-column:2;grid-row:1/3}.w4 .art svg{max-height:17rem}.w4 h2{font-size:clamp(2rem,3.6vw,3rem)}}
.back{display:inline-block;margin:.8rem 0 .4rem;font-weight:700;text-decoration:none;border:2px solid var(--ink);border-radius:999px;padding:.45rem 1.1rem}
.banner{--c:#fff;display:grid;grid-template-columns:1.1fr 1fr;gap:1.5rem;align-items:center;margin:1rem 0 2.2rem;padding:clamp(1.5rem,4vw,3.2rem);border-radius:36px;background:var(--c);color:var(--k)}
.banner h1{font:800 clamp(2.3rem,6.2vw,5rem)/.95 var(--hd);letter-spacing:-.04em;margin:0}
.banner .lead{font-size:1.25rem;font-weight:500;margin:1rem 0 0;max-width:28rem}
.banner .art svg{max-height:19rem}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:2.2rem;align-items:start;padding-bottom:4rem}
.copy p{font-size:1.2rem;line-height:1.7;max-width:38rem;margin:0 0 1.2rem}
.facts{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:1.5rem;display:grid;gap:1.2rem}
.facts b{display:block;font:700 1rem var(--hd);margin-bottom:.4rem}
.facts .chips{padding:0}.facts .chips li{background:var(--bg);border-color:var(--line);color:var(--ink)}
.links{display:grid;gap:.6rem}.links .btn{text-align:center}
.note{color:var(--mute);margin:0}
footer{border-top:1px solid var(--line);padding:1.4rem 0 2.2rem;color:var(--mute);font-size:.95rem}
svg .l{stroke:var(--k);stroke-width:3;fill:none}svg .f{fill:#fff}svg .a{fill:var(--k)}svg .s{fill:rgba(255,255,255,.5)}
svg .al{stroke:var(--k);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg text{font:800 16px var(--hd);fill:var(--k)}svg text.w{fill:#fff}
.view{animation:fade .35s both}
@keyframes up{from{opacity:0;transform:translateY(28px) scale(.97)}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@media (max-width:900px){.list{grid-template-columns:repeat(2,1fr)}.w2{grid-column:span 1}.w4{grid-column:span 2}.banner,.cols{grid-template-columns:1fr}}
@media (max-width:560px){.list{grid-template-columns:1fr}.w2,.w4{grid-column:auto}.tile{min-height:20rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

  }else{
    const c=t[p.id];document.title=c.t+" – Ethan Mebaley Kahel";
    app.innerHTML=`<article class="view"><a class="back" href="#/">${t.back}</a><section class="banner" style="--c:${p.c}"><div><h1>${c.t}</h1><p class="lead">${c.s}</p></div><div class="art">${p.img}</div></section><div class="cols"><div class="copy">${c.d.map(x=>`<p>${x}</p>`).join("")}</div><aside class="facts"><div><b>${t.tech}</b><ul class="chips">${p.tech.map(x=>`<li>${x}</li>`).join("")}</ul></div>${c.team?`<div><b>${t.team}</b>${c.team}</div>`:""}${p.links.length?`<div class="links">${p.links.map((l,i)=>`<a class="btn${i?"":" main"}" href="${l[0]}" target="_blank" rel="noopener">${t[l[1]]}</a>`).join("")}</div>`:`<p class="note">${t.priv}</p>`}</aside></div></article>`;
  }
  if(top)scrollTo(0,0);
}
$("#fr").onclick=()=>{lang="fr";save("lang",lang);render()};
$("#en").onclick=()=>{lang="en";save("lang",lang);render()};
$("#theme").onclick=()=>{theme=isDark()?"light":"dark";save("theme",theme);render()};
addEventListener("hashchange",()=>render(true));render();
</script>
</body>
